<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Menu Extractor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .alert {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:disabled { background: #ccc; }
        .result {
            margin-top: 30px;
            display: none;
        }
        .result.show { display: block; }
        .restaurant-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .menu-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
        .error {
            background: #f8d7da;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .error.show { display: block; }
        .loader {
            text-align: center;
            padding: 30px;
            display: none;
        }
        .loader.show { display: block; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Swiggy Menu Extractor</h1>
        
        <div class="alert">
            <strong>How to use:</strong><br>
            Enter restaurant ID from Swiggy URL (e.g., 34908 from "rest34908")
        </div>

        <input type="text" id="restaurantId" placeholder="Enter Restaurant ID (e.g., 34908)" />
        <button onclick="extractMenu()">🔍 Extract Menu</button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Fetching menu...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="restaurant-info" id="info"></div>
            <button onclick="downloadExcel()">📥 Download Excel</button>
            <div id="menuList"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        let menuData = [];
        let restaurantData = {};

        async function extractMenu() {
            const restaurantId = document.getElementById('restaurantId').value.trim();
            
            if (!restaurantId || !/^\d+$/.test(restaurantId)) {
                showError('Please enter valid restaurant ID (numbers only)');
                return;
            }

            showLoader(true);
            hideError();
            hideResult();

            try {
                const response = await fetch(`/.netlify/functions/proxy?restaurantId=${restaurantId}`);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to fetch menu');
                }

                const data = await response.json();

                if (!data.menu || data.menu.length === 0) {
                    throw new Error('No menu items found');
                }

                menuData = data.menu;
                restaurantData = data;
                displayMenu();
                showResult();

            } catch (error) {
                showError(error.message);
            } finally {
                showLoader(false);
            }
        }

        function displayMenu() {
            document.getElementById('info').innerHTML = `
                <h2>${restaurantData.name}</h2>
                <p><strong>Cuisine:</strong> ${restaurantData.cuisine}</p>
                <p><strong>Area:</strong> ${restaurantData.area}</p>
                <p><strong>Rating:</strong> ⭐ ${restaurantData.rating}</p>
                <p><strong>Total Items:</strong> ${menuData.length}</p>
            `;

            let html = '';
            menuData.forEach(item => {
                html += `
                    <div class="menu-item">
                        <span>${item.isVeg ? '🟢' : '🔴'} ${item.name}</span>
                        <span>₹${item.price}</span>
                    </div>
                `;
            });
            document.getElementById('menuList').innerHTML = html;
        }

        function downloadExcel() {
            const data = menuData.map(item => ({
                'Category': item.category,
                'Item': item.name,
                'Type': item.isVeg ? 'Veg' : 'Non-Veg',
                'Price': item.price,
                'Description': item.description
            }));

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(data);
            XLSX.utils.book_append_sheet(wb, ws, 'Menu');
            XLSX.writeFile(wb, `${restaurantData.name}_menu.xlsx`);
        }

        function showLoader(show) {
            document.getElementById('loader').classList.toggle('show', show);
        }
        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = '❌ ' + msg;
            el.classList.add('show');
        }
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }
        function showResult() {
            document.getElementById('result').classList.add('show');
        }
        function hideResult() {
            document.getElementById('result').classList.remove('show');
        }
    </script>
</body>
</html>
