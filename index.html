<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swiggy Menu Downloader</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <h1>Swiggy Menu Downloader</h1>
        <p>Paste any Swiggy restaurant link below:</p>

        <input type="text" id="urlInput" placeholder="Paste Swiggy restaurant URL here" />

        <button id="openBtn">Open Restaurant Page</button>
        <button id="extractBtn">Extract Menu</button>
        <button id="downloadBtn">Download CSV</button>

        <h2>Menu Items</h2>
        <div id="menuContainer"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
