<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Menu Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .error.active {
            display: block;
        }

        .info {
            background: #e3f2fd;
            border: 2px solid #90caf9;
            color: #1976d2;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 0.9em;
        }

        .menu-display {
            margin-top: 30px;
            display: none;
        }

        .menu-display.active {
            display: block;
        }

        .restaurant-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .restaurant-info h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .restaurant-info p {
            color: #666;
            margin: 5px 0;
        }

        .menu-items {
            max-height: 500px;
            overflow-y: auto;
        }

        .menu-category {
            margin-bottom: 25px;
        }

        .category-title {
            background: #667eea;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .menu-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: start;
        }

        .item-details h4 {
            color: #333;
            margin-bottom: 5px;
        }

        .item-description {
            color: #666;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .item-price {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
            white-space: nowrap;
            margin-left: 15px;
        }

        .download-section {
            text-align: center;
            margin-top: 20px;
        }

        .example-link {
            color: #667eea;
            cursor: pointer;
            font-size: 0.9em;
        }

        .example-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ Swiggy Menu Scraper</h1>
        <p class="subtitle">Extract and download restaurant menus from Swiggy</p>

        <div class="info">
            <strong>📌 How to use:</strong> Copy any Swiggy restaurant URL from your browser and paste it below.
        </div>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="swiggyUrl" 
                    placeholder="Paste Swiggy restaurant URL here..."
                    value="">
            </div>
            <button id="scrapeBtn" onclick="scrapeMenu()">Extract Menu</button>
            <p style="margin-top: 10px; color: #666; font-size: 0.9em;">
                Example: <span class="example-link" onclick="fillExample()">https://www.swiggy.com/city/bangalore/meghana-foods-rest34908</span>
            </p>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">Fetching menu data...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="menu-display" id="menuDisplay">
            <div class="restaurant-info" id="restaurantInfo"></div>
            <div class="download-section">
                <button onclick="downloadExcel()">📥 Download Menu as Excel</button>
            </div>
            <div class="menu-items" id="menuItems"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        let menuData = [];
        let restaurantData = {};

        function fillExample() {
            document.getElementById('swiggyUrl').value = 'https://www.swiggy.com/city/bangalore/meghana-foods-residency-road-shanthala-nagar-rest34908';
        }

        // CORS Proxies with fallback
        const CORS_PROXIES = [
            'https://api.codetabs.com/v1/proxy?quest=',
            'https://corsproxy.io/?',
            'https://api.allorigins.win/get?url='
        ];

        async function fetchWithProxy(url) {
            let lastError;
            
            for (let i = 0; i < CORS_PROXIES.length; i++) {
                try {
                    const proxyUrl = CORS_PROXIES[i] + encodeURIComponent(url);
                    console.log(`Trying proxy ${i + 1}:`, CORS_PROXIES[i]);
                    
                    const response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Proxy returned ${response.status}`);
                    }
                    
                    const text = await response.text();
                    
                    // Handle allorigins format
                    if (CORS_PROXIES[i].includes('allorigins')) {
                        const wrapper = JSON.parse(text);
                        if (wrapper.contents) {
                            return JSON.parse(wrapper.contents);
                        }
                    }
                    
                    // Direct JSON response
                    return JSON.parse(text);
                    
                } catch (error) {
                    console.error(`Proxy ${i + 1} failed:`, error.message);
                    lastError = error;
                    // Try next proxy
                }
            }
            
            throw lastError || new Error('All proxies failed');
        }

        function extractLocationFromUrl(url) {
            const cityMatch = url.match(/\/city\/([^\/]+)\//);
            const city = cityMatch ? cityMatch[1] : 'bangalore';
            
            const cityCoords = {
                'bangalore': { lat: '12.9715987', lng: '77.5945627' },
                'delhi': { lat: '28.7041', lng: '77.1025' },
                'mumbai': { lat: '19.0760', lng: '72.8777' },
                'hyderabad': { lat: '17.3850', lng: '78.4867' },
                'pune': { lat: '18.5204', lng: '73.8567' },
                'chennai': { lat: '13.0827', lng: '80.2707' },
                'kolkata': { lat: '22.5726', lng: '88.3639' }
            };
            
            return cityCoords[city] || cityCoords['bangalore'];
        }

        async function scrapeMenu() {
            const url = document.getElementById('swiggyUrl').value.trim();
            
            if (!url) {
                showError('Please enter a Swiggy restaurant URL');
                return;
            }

            const restaurantIdMatch = url.match(/rest(\d+)/);
            if (!restaurantIdMatch) {
                showError('Invalid Swiggy URL. Please ensure it contains "rest" followed by numbers.');
                return;
            }

            const restaurantId = restaurantIdMatch[1];
            const location = extractLocationFromUrl(url);
            
            showLoader(true);
            hideError();
            hideMenu();

            try {
                console.log('Fetching menu for restaurant:', restaurantId);
                
                const apiUrl = `https://www.swiggy.com/dapi/menu/pl?page-type=REGULAR_MENU&complete-menu=true&lat=${location.lat}&lng=${location.lng}&restaurantId=${restaurantId}`;
                
                console.log('Fetching from Swiggy API...');
                const data = await fetchWithProxy(apiUrl);
                
                console.log('Data received successfully');

                // Extract restaurant info
                let restaurantInfo = null;
                const cards = data?.data?.cards || [];
                
                for (const card of cards) {
                    if (card?.card?.card?.info) {
                        restaurantInfo = card.card.card.info;
                        break;
                    }
                }

                if (!restaurantInfo) {
                    throw new Error('Restaurant not found. Please verify the URL is correct.');
                }

                // Extract menu items
                const menuCards = data?.data?.cards?.find(card => 
                    card?.groupedCard?.cardGroupMap?.REGULAR
                )?.groupedCard?.cardGroupMap?.REGULAR?.cards || [];

                const menuItems = [];

                menuCards.forEach(card => {
                    try {
                        if (card?.card?.card?.itemCards) {
                            const category = card.card.card.title || 'Others';
                            card.card.card.itemCards.forEach(itemCard => {
                                const item = itemCard?.card?.info;
                                if (item && item.name) {
                                    menuItems.push({
                                        category: category,
                                        name: item.name,
                                        price: item.price ? (item.price / 100).toFixed(2) : 
                                               item.defaultPrice ? (item.defaultPrice / 100).toFixed(2) : 
                                               item.finalPrice ? (item.finalPrice / 100).toFixed(2) : 'N/A',
                                        description: item.description || '',
                                        isVeg: item.isVeg === 1 || item.itemAttribute?.vegClassifier === 'VEG'
                                    });
                                }
                            });
                        }
                        
                        if (card?.card?.card?.categories) {
                            const mainCategory = card.card.card.title || 'Others';
                            card.card.card.categories.forEach(subCategory => {
                                const category = subCategory.title || mainCategory;
                                subCategory.itemCards?.forEach(itemCard => {
                                    const item = itemCard?.card?.info;
                                    if (item && item.name) {
                                        menuItems.push({
                                            category: category,
                                            name: item.name,
                                            price: item.price ? (item.price / 100).toFixed(2) : 
                                                   item.defaultPrice ? (item.defaultPrice / 100).toFixed(2) : 
                                                   item.finalPrice ? (item.finalPrice / 100).toFixed(2) : 'N/A',
                                            description: item.description || '',
                                            isVeg: item.isVeg === 1 || item.itemAttribute?.vegClassifier === 'VEG'
                                        });
                                    }
                                });
                            });
                        }
                    } catch (err) {
                        console.error('Error parsing menu card:', err);
                    }
                });

                console.log(`Successfully parsed ${menuItems.length} menu items`);

                if (menuItems.length === 0) {
                    throw new Error('No menu items found for this restaurant.');
                }

                menuData = menuItems;
                restaurantData = {
                    restaurantName: restaurantInfo.name || 'Unknown Restaurant',
                    cuisine: restaurantInfo.cuisines?.join(', ') || 'N/A',
                    area: restaurantInfo.areaName || restaurantInfo.locality || 'N/A',
                    city: restaurantInfo.city || 'N/A',
                    rating: restaurantInfo.avgRating || 'N/A',
                    costForTwo: restaurantInfo.costForTwoMessage || 'N/A',
                    menu: menuItems
                };

                displayMenu(restaurantData);
                showMenu();
                
                console.log('✅ Menu displayed successfully');
            } catch (error) {
                console.error('❌ Scraping error:', error);
                showError(error.message || 'Failed to fetch menu. Please verify the URL and try again.');
            } finally {
                showLoader(false);
            }
        }

        function displayMenu(data) {
            const restaurantInfo = document.getElementById('restaurantInfo');
            restaurantInfo.innerHTML = `
                <h2>${data.restaurantName}</h2>
                <p><strong>Cuisine:</strong> ${data.cuisine}</p>
                <p><strong>Location:</strong> ${data.area}, ${data.city}</p>
                ${data.rating && data.rating !== 'N/A' ? `<p><strong>Rating:</strong> ⭐ ${data.rating}</p>` : ''}
                ${data.costForTwo && data.costForTwo !== 'N/A' ? `<p><strong>Cost:</strong> ${data.costForTwo}</p>` : ''}
                <p><strong>Total Items:</strong> ${data.menu.length}</p>
            `;

            const menuItems = document.getElementById('menuItems');
            const categories = {};

            data.menu.forEach(item => {
                if (!categories[item.category]) {
                    categories[item.category] = [];
                }
                categories[item.category].push(item);
            });

            let html = '';
            for (const [category, items] of Object.entries(categories)) {
                html += `<div class="menu-category"><div class="category-title">${category}</div>`;

                items.forEach(item => {
                    const vegSymbol = item.isVeg ? '🟢' : '🔴';
                    html += `
                        <div class="menu-item">
                            <div class="item-details">
                                <h4>${vegSymbol} ${item.name}</h4>
                                ${item.description ? `<p class="item-description">${item.description}</p>` : ''}
                            </div>
                            <div class="item-price">₹${item.price}</div>
                        </div>
                    `;
                });

                html += `</div>`;
            }

            menuItems.innerHTML = html;
        }

        function downloadExcel() {
            if (menuData.length === 0) {
                showError('No menu data to download');
                return;
            }

            const excelData = menuData.map(item => ({
                'Category': item.category,
                'Item Name': item.name,
                'Type': item.isVeg ? 'Vegetarian' : 'Non-Vegetarian',
                'Price (₹)': item.price,
                'Description': item.description || 'N/A'
            }));

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(excelData);

            ws['!cols'] = [
                { wch: 20 }, { wch: 35 }, { wch: 15 }, { wch: 12 }, { wch: 50 }
            ];

            XLSX.utils.book_append_sheet(wb, ws, 'Menu');

            const restaurantName = restaurantData.restaurantName ? 
                restaurantData.restaurantName.replace(/[^a-z0-9]/gi, '_').toLowerCase() : 
                'swiggy_menu';
            const filename = `${restaurantName}_menu.xlsx`;

            XLSX.writeFile(wb, filename);
            console.log('✅ Downloaded:', filename);
        }

        function showLoader(show) {
            const loader = document.getElementById('loader');
            const btn = document.getElementById('scrapeBtn');
            loader.classList.toggle('active', show);
            btn.disabled = show;
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = '❌ ' + message;
            error.classList.add('active');
        }

        function hideError() {
            document.getElementById('error').classList.remove('active');
        }

        function showMenu() {
            document.getElementById('menuDisplay').classList.add('active');
        }

        function hideMenu() {
            document.getElementById('menuDisplay').classList.remove('active');
        }

        document.getElementById('swiggyUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') scrapeMenu();
        });
    </script>
</body>
</html>
